# An example duo session file.
#
# Copy it to ~/.config/duo/default.conf to have every new session start this
# way, or to ~/.config/duo/<name>.conf for one named session (duo -s <name>).
# Or point at it directly:  duo -f ~/duo/examples/session.conf
#
# It is read when a session starts. Attaching to a session that is already
# running ignores it, so change something and then `duo -k` to see it.

# tabs (one window at a time), columns, rows or grid
layout columns

# how many panes are open at the start; the rest of the windows sit behind
panes 2

# which window has focus (1-based, in the order listed below)
focus 1

# Each `window` line opens one window. A name is optional; without one, the
# status bar shows whatever is running. Everything after `--` is typed into
# that window's shell, so Ctrl-C leaves you at a prompt there.

window shell

# A monitor that reruns every 5 seconds and clears in between. `watch` does
# the repeating; duo only draws what changes, so it doesn't flicker.
window climate -- watch -n 5 python3 /home/matt/aht20/aht20.py

# Drop `clear` by using a plain loop instead, and the readings pile up so you
# can scroll back through them with C-a [
# window climate -- while :; do python3 /home/matt/aht20/aht20.py; sleep 5; done

window logs -- journalctl -f
